# earth.hillview.cz: rootless Podman, `podman compose` with docker compose as the provider;
# deploy/README.md has the layout, the .env, the boot restart and heal-unhealthy.sh. The data
# directories are siblings of this checkout: ../../{dem,store,ortho}.
#
# Rootless: the containers' root IS the deploying user, so earth and the builder run as 0:0 and what
# they write stays that user's. Caddy runs on the HOST network: it sees each client's real address (rootless Podman's port
# forwarding does not pass it on) and reaches earth on the published loopback port. It SETS
# X-Forwarded-For to the address it sees; earth believes that header only from EARTH_TRUSTED_PROXIES,
# 172.30.0.3: earth's own address, which is where rootless Podman's port forwarder delivers from (the
# port is published on loopback only, so what arrives that way came through Caddy).
#
# The DEM mosaics are read-only to earth; the store (releases, channels, kept tiles) is its own.
#
# Hardening (recon pl03): each serving container drops every capability, cannot gain privileges, and has a
# read-only root with tmpfs where it writes scratch; what a code-execution bug in one could touch is its own
# volumes. Rootless already maps their root to the deploying user.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: [no-new-privileges]
  read_only: true
  tmpfs: [/tmp]

services:
  earth:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: always
    user: "0:0"
    <<: *hardened
    environment:
      EARTH_TRUSTED_PROXIES: 172.30.0.3
      # the orthophoto: the ortho service below (earth/ortho.py)
      EARTH_ORTHO_URL: http://ortho:8080/wmts/oi/webmercator/{z}/{x}/{y}.png
      # a first view of an area waits for its sheets (~3.5 s each, several at once)
      EARTH_ORTHO_TIMEOUT_S: 120
    ports: ["127.0.0.1:8090:8000"]
    cpus: 5
    mem_limit: 12g
    volumes:
      - ../../dem:/dem:ro
      - ../../store:/var/lib/earth
    networks: { earth: { ipv4_address: 172.30.0.3 } }
    healthcheck:
      # the shell form: Podman re-splits an exec-form healthcheck's arguments on spaces, and python
      # then got only "import" (2026-11-01)
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)\""]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    # heal-unhealthy.sh also asks this from the host: healthy inside is not reachable (2026-11-02)
    labels: { earth.heal: restart, earth.heal.probe: "http://127.0.0.1:8090/health" }
  ortho:
    # ČÚZK's orthophoto from its open JP2 sheets, each fetched when a detail tile first needs it, with a 4 m
    # overview filled in as they arrive (../ortho). Only earth talks to it, on this network; nothing is
    # published.
    build: { context: ../ortho }
    restart: always
    <<: *hardened
    # /run/ortho: the mapfile and mapproxy.yaml the entrypoint writes at each start (ortho/app/config.py)
    tmpfs: [/tmp, /run]
    cpus: 3
    mem_limit: 6g
    environment:
      # the disk this server gives the sheets: its own setting, not the code's
      SHEET_BUDGET_GB: ${SHEET_BUDGET_GB:?set SHEET_BUDGET_GB (GB of sheets the ortho service may hold) in deploy/.env}
    volumes:
      - ../../ortho/sheets:/data
      - ../../ortho/state:/state
      - ../../ortho/cache:/cache
    networks: [earth]
    # here, not only in its Dockerfile: Podman builds OCI images, which carry no HEALTHCHECK
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/wmts/1.0.0/WMTSCapabilities.xml > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels: { earth.heal: restart }
  caddy:
    # 2.11.7 released 2026-10-03 (cooloff); this image pushed 2026-10-30
    image: docker.io/library/caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: always
    <<: *hardened
    # the image's caddy binary carries cap_net_bind_service=ep: without the capability it cannot even start
    cap_add: [NET_BIND_SERVICE]
    network_mode: host
    environment:
      # only /<EARTH_PREFIX>/... reaches earth (short, fixed, in the clients' config); the terrain mosaics
      # are under a secret of their own, /<EARTH_DEM_PREFIX>/... (./Caddyfile)
      EARTH_PREFIX: ${EARTH_PREFIX:?set EARTH_PREFIX (8 random [a-z0-9]) in deploy/.env}
      EARTH_DEM_PREFIX: ${EARTH_DEM_PREFIX:?set EARTH_DEM_PREFIX (another long random string) in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../sites:/etc/caddy/sites:ro
      - ../../dem:/srv/dem:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels: { earth.heal: restart }
  garage:
    # Garage, an S3 object store for files other services keep on this server (./garage.toml): not earth's. A
    # network of its own, so nothing in earth's stack reaches it but Caddy on loopback, through a site of the
    # server's own (./Caddyfile, sites/).
    # v2.5.0 released 2026-10-24 (cooloff)
    image: docker.io/dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    restart: always
    user: "0:0"
    <<: *hardened
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET (openssl rand -hex 32) in deploy/.env}
      # at info Garage logs every request: a line per object read
      RUST_LOG: garage=info
    # loopback only: Caddy (host network) reaches the S3 API (3900) and the web endpoint (3902); 3903 is the
    # admin port, which without an admin token answers only /health and /metrics
    ports: ["127.0.0.1:3900:3900", "127.0.0.1:3902:3902", "127.0.0.1:3903:3903"]
    cpus: 3
    mem_limit: 1g
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ../../garage/meta:/var/lib/garage/meta
      - ../../garage/data:/var/lib/garage/data
    networks: [garage]
    healthcheck:
      # the image is the garage binary alone (no shell, no curl): ask the node itself over its RPC
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    labels: { earth.heal: restart, earth.heal.probe: "http://127.0.0.1:3903/health" }
  builder:
    # one-shot: everything earth's terrain reads, built into the DEM dir from the sources (builder/build_all.sh).
    # `podman compose run --rm builder [bbox] [layer]`. Incremental, so a rerun resumes; never part of `up`.
    profiles: [build]
    build: { context: .., dockerfile: deploy/builder.Dockerfile }
    user: "0:0"
    # sheets at once (build_mosaic.py --jobs): 5 of the server's 6 vCPUs, one left for earth itself
    environment:
      BUILD_JOBS: 5
    cpus: 5
    mem_limit: 8g
    volumes:
      - ../../dem:/dem
    network_mode: bridge
networks:
  earth:
    ipam: { config: [{ subnet: 172.30.0.0/24, gateway: 172.30.0.1 }] }
  garage: {}
volumes:
  caddy_data:
  caddy_config:
